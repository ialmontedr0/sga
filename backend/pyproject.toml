[project]
name = "sga-backend"
version = "0.1.0"
description = "Backend del Sistema de Gestion Documental Judicial (SGA)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Proprietary"
authors = [
    { name = "Equipo SGA" },
]
keywords = ["judicial", "archivo", "gestion-documental", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed"
]
dependencies = [
    "alembic>=1.20,<2",
    "arq>=0.28,<0.29",
    "fastapi>=0.161,<1",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "pwdlib[argon2]>=0.3,<1",
    "redis[hiredis]>=5.2,<6",
    "sqlalchemy[asyncio]>=2.1,<3",
    "structlog>=26.1,<27",
    "uvicorn[standard]>=0.54,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=2.4,<3",
    "pre-commit>=4.7,<5",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judicial_archive"]

[tool.hatch.build.targets.sdist]
include = [
    "src/judicial_archive",
    "tests",
    "alembic",
    "alembic.ini",
    "README.md",
]

[tool.uv]
package = true
python-preference = "managed"

# Ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    ".venv",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
  "E4",   # errores de importacion
  "E7",   # errores de estructura
  "E9",   # errores de ejecucion
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplificaciones
  "ASYNC",# errores de async
  "C4",   # comprehensions
  "DTZ",  # fechas con zona horaria
  "PT",   # pytest-style
  "RUF",  # reglas propias de ruff
  "S",    # bandit
  "LOG",  # logging
  "G",    # formato de logging
  "PTH",  # pathlib
  "T20",  # prohibir print
]

ignore = [
    "B008",   # FastAPI usa Depends() en defaults
    "UP046",  # Se usa Generic[T] por claridad y compatibilidad con Pydantic
    "RUF001", # Caracteres unicode en mensajes en espanol
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S107"]
"alembic/versions/**/*.py" = ["E501"]
"src/judicial_archive/tasks/worker.py" = ["ARG"]

[tool.ruff.lint.isort]
known-first-party = ["judicial_archive", "tests"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
show_column_numbers = true
pretty = true
plugins = [
  "pydantic.mypy",
]
exclude = [
  "^\\.venv/",
  "alembic/versions/",
]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["arq", "arq.*"]
ignore_missing_imports = true

# pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=judicial_archive",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: require PostgreSQL y Redis reales",
    "security: comprobaciones de seguridad",
    "slow: prueba lenta",
]
filterwarnings = [
    "error",
]

# cobertura
[tool.coverage.run]
branch = true
source = ["src/judicial_archive"]
omit = [
    "src/judicial_archive/asgi.py",
    "src/judicial_archive/__main__.py"
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
